<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'payment.css' %}">
    <style>
        body {
            text-align: center;
            padding: 40px 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .card {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
            margin: 0 auto;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .success-circle {
            border-radius: 50%;
            height: 200px;
            width: 200px;
            background: #F8FAF5;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease-in-out;
        }

        .checkmark {
            color: #4CAF50;
            font-size: 100px;
            line-height: 200px;
            animation: checkmark 0.8s ease-in-out;
        }

        h1 {
            color: #2ecc71;
            font-weight: 600;
            font-size: 40px;
            margin: 20px 0 10px;
        }

        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
            margin: 10px 0;
        }

        .button {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            margin: 15px 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .button:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        @keyframes checkmark {
            0% { transform: scale(0); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="success-circle">
            <i class="checkmark">✓</i>
        </div>
        <h1>Success</h1>
        <p>Your Payment is Successful 🎉</p>
        <p>Your booking has been confirmed. Click on <b>Show Your Ticket</b> to download the ticket.</p>
        <button type="button" class="button" onclick="window.location.href = 'http://localhost:8000/ticket';">Show Your Ticket</button>
        <button type="button" class="button" style="background: #3498db;" onclick="window.location.href = 'http://localhost:8000/login/';">Go to Home</button>
    </div>
</body>
</html>
