<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KIA Boarding Pass</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #fff;
            margin: 0;
            padding: 0;
        }
        .boarding-pass {
            width: 700px;
            margin: 20px auto;
            background: #fff;
            border: 2px solid #000;
            padding: 10px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            color: #000;
            font-size: 24px;
        }
        .main-content {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px 0;
            border-bottom: 1px dashed #000;
        }
        .passenger-info, .flight-info {
            flex: 1;
            box-sizing: border-box;
        }
        .info-row {
            margin: 10px 0;
        }
        .label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }
        .value {
            font-size: 18px;
            font-weight: bold;
            color: #000;
        }
        .flight-route {
            text-align: center;
            margin: 20px 0;
            padding: 10px;
            background: #f8f8f8;
            border: 1px solid #ddd;
        }
        .route-cities {
            font-size: 24px;
            font-weight: bold;
        }
        .barcode {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border-top: 1px dashed #000;
        }
        .barcode-text {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            letter-spacing: 5px;
        }
        @media print {
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                padding: 0;
                margin: 0;
            }
            .boarding-pass {
                border: 2px solid #000;
                margin: 0 auto;
                width: 100%;
                max-width: 700px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="boarding-pass">
        <div class="header">
            <h1>KIA BOARDING PASS</h1>
        </div>
        
        <div class="main-content">
            <div class="passenger-info">
                <div class="info-row">
                    <div class="label">Passenger Name</div>
                    <div class="value">{{ t.name }}</div>
                </div>
                <div class="info-row">
                    <div class="label">PNR Number</div>
                    <div class="value">{{ t.pnr }}</div>
                </div>
                <div class="info-row">
                    <div class="label">Seat</div>
                    <div class="value">{{ t.seat_no }}</div>
                </div>
            </div>
            
            <div class="flight-info">
                <div class="info-row">
                    <div class="label">Flight Number</div>
                    <div class="value">{{ t.flight_no }}</div>
                </div>
                <div class="info-row">
                    <div class="label">Date & Time</div>
                    <div class="value">{{ t.arrival }}</div>
                </div>
                <div class="info-row">
                    <div class="label">Gate</div>
                    <!-- <div class="value">{{ t.gate }}</div> -->
                    <div class="value">B3</div>

                </div>
            </div>
        </div>

        <div class="flight-route">
            <div class="label">Flight Route</div>
            <div class="route-cities">
                {{ t.from_city }} ✈ {{ t.to_city }}
            </div>
        </div>

        <div class="barcode">
            <div class="label">Booking Reference</div>
            <div class="barcode-text">*{{ t.pnr }}*</div>
        </div>
    </div>
</body>
</html>
